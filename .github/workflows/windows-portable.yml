name: Windows portable

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content frontend/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag and application versions differ"
          }
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Build portable ZIP
        run: python scripts/build_portable.py
      - name: Test the extracted program with no Python or Node in PATH
        run: python scripts/smoke_portable.py release/ModelCheck3D-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ModelCheck3D-Windows-x64
          path: |
            release/ModelCheck3D-Windows-x64.zip
            release/ModelCheck3D-Windows-x64.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ModelCheck3D-Windows-x64
          path: release
      - name: Publish tested portable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/ModelCheck3D-Windows-x64.zip release/ModelCheck3D-Windows-x64.zip.sha256 --verify-tag --title "ModelCheck 3D $RELEASE_TAG — Windows portable" --notes "Download ModelCheck3D-Windows-x64.zip, extract it completely and run ModelCheck3D.exe. No Python, Node.js or installation is required. This Windows x64 package passed the packaged application smoke test, including native STL analysis and PDF export. The Source code archives below are for development."
